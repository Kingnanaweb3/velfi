    <script>
      // Set the theme before the page paints, so it never flashes the wrong colours.
      (function () {
        var t = 'light'
        try { t = localStorage.getItem('velfi_theme') || 'light' } catch (e) {}
        if (t === 'system') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light')
      })()
    </script>
