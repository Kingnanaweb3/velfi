[package]
name = "velfi"
version = "0.1.0"
description = "Velfi on Solana: guardrail mandates, claim-link escrow, streams, split streams, SafePay and staged pay"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "velfi"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
velfi-core = { path = "../../crates/velfi-core" }
